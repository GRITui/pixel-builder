# Internal deployment: web app + API on :8787, MCP over HTTP on :8788.
# Both read PIXEL_BUILDER_TOKEN from .env (see docs/deploy.md). Put them behind your VPN / reverse proxy.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      AUTH: ${AUTH:-token}
      PIXEL_BUILDER_TOKEN: ${PIXEL_BUILDER_TOKEN:?set PIXEL_BUILDER_TOKEN in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PIXEL_BUILDER_DATA: /data
    ports:
      - "${BIND:-127.0.0.1}:8787:8787"
    volumes:
      - pixel-data:/data
    # healthcheck (/healthz) comes from the Dockerfile

  # MCP server for agents. Its project lives in `app` (shared library); PNG exports go to /exports.
  mcp:
    build: .
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command:
      - node
      - dist-node/cli.mjs
      - mcp
      - --http
      - --host
      - 0.0.0.0
      - --port
      - "8788"
      - --workspace
      - http://app:8787/api/projects/${PIXEL_BUILDER_PROJECT:-team}
      - --out-dir
      - /exports
    environment:
      PIXEL_BUILDER_TOKEN: ${PIXEL_BUILDER_TOKEN:?set PIXEL_BUILDER_TOKEN in .env}
      # Host names clients use to reach this service (DNS rebinding guard), comma separated.
      PIXEL_BUILDER_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "${BIND:-127.0.0.1}:8788:8788"
    volumes:
      - pixel-exports:/exports
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8788,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pixel-data:
  pixel-exports:
